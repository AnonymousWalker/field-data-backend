# fdb-api: local HTTP helper for importing, editing and following repos through the pipeline.
# Same code as bin/fdb (tools/fdb). Published on 127.0.0.1 only; it has no auth.
services:
  fdb-api:
    build:
      context: ../docker/fdb-api
      secrets: [extra_ca]
    image: fdb/fdb-api:local
    environment:
      FDB_API_HOST: 0.0.0.0
      FDB_API_PORT: "7080"
      FDB_WACS_URL: http://wacs:3000
      FDB_BLOB_URL: http://azurite:10000/devstoreaccount1/$$web
      FDB_HASURA_URL: http://lapi-hasura:8080
      FDB_IMPORTS_DIR: /data/imports
      # Host ports, only used to show the URLs a person can open.
      WACS_HTTP_PORT: "${WACS_HTTP_PORT:-3000}"
      WACS_ADMIN_USER: "${WACS_ADMIN_USER:-fdbadmin}"
      WACS_ADMIN_PASSWORD: "${WACS_ADMIN_PASSWORD:-fdbadmin123}"
    volumes:
      - ../tools:/app/tools:ro
      - ../.local/extra-ca.pem:/run/fdb/extra-ca.pem:ro
      - fdb_imports:/data/imports
    ports:
      - "127.0.0.1:${FDB_API_PORT:-7080}:7080"
    depends_on:
      wacs:
        condition: service_healthy
      lapi-hasura:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  fdb_imports:

secrets:
  extra_ca:
    file: ../.local/extra-ca.pem
